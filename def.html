<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>MindAR Two Targets Fixed</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

a-scene {
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0;
  left: 0;
}

#custom-text {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 82%;
  max-width: 380px;

  background: rgba(0, 0, 0, 0.75);
  color: white;

  padding: 16px 20px;
  border-radius: 18px;

  font-size: 15px;
  line-height: 1.8;

  z-index: 9999;

  /* 確保文字中的換行（反引號字串）能被正確渲染 */
  white-space: pre-line; 

  /* 修正動畫：改用 visibility 搭配 opacity，解決 display:none 無法觸發 transition 的問題 */
  visibility: hidden;
  opacity: 0;
  pointer-events: none; /* 隱藏時防止文字框範圍擋住底下的點擊事件 */
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

#custom-text.show {
  visibility: visible;
  opacity: 1;
  pointer-events: auto; /* 顯示時恢復滑動或點擊 */
}
</style>
</head>

<body>

<div id="custom-text"></div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>

  <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>

</a-scene>

<script>
window.addEventListener("load", () => {

  const target0 = document.querySelector("#target0");
  const target1 = document.querySelector("#target1");
  const box = document.querySelector("#custom-text");

  // 顯示文字框
  function show(text) {
    box.textContent = text; // 使用 textContent 效能較佳且較安全
    box.classList.add("show");
  }

  // 隱藏文字框
  function hide() {
    box.classList.remove("show");
  }

  // 1. 處理 target0 (Index 0: 綠繡眼) 的掃描事件
  target0.addEventListener("targetFound", () => {
    console.log("target0 FOUND");
    show(`綠繡眼是一種小型鳥類，身體是綠色的，眼睛周圍有一圈白色羽毛，非常可愛。

牠們動作很靈活，常常在樹木間快速跳來跳去。

綠繡眼喜歡吸食花蜜，也會吃水果，因此常出現在開花的樹附近。`);
  });
  target0.addEventListener("targetLost", hide);


  // 2. 處理 target1 (Index 1: 白頭翁) 的掃描事件
  target1.addEventListener("targetFound", () => {
    console.log("target1 FOUND");
    show(`白頭翁最大的特徵，就是頭上有白色羽毛，看起來像戴著白色帽子。

牠們喜歡停在樹枝上唱歌，叫聲相當響亮，在住宅區與校園中都很常見。

白頭翁喜歡吃水果、花蜜與小昆蟲，是台灣常見的都市鳥類之一。`);
  });
  target1.addEventListener("targetLost", hide);

});
</script>

</body>
</html>
