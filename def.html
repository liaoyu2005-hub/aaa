<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>MindAR Stable Debug Version</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

a-scene {
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0;
  left: 0;
}

#custom-text {
  display: none;
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  max-width: 420px;

  background: rgba(0,0,0,0.85);
  color: white;
  padding: 16px 18px;
  border-radius: 14px;

  font-size: 14px;
  line-height: 1.6;
  white-space: pre-line;

  opacity: 0;
  transition: 0.25s ease;
  z-index: 9999;
}

#custom-text.show {
  display: block;
  opacity: 1;
}
</style>
</head>

<body>

<div id="custom-text"></div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="t0" mindar-image-target="targetIndex: 0"></a-entity>
  <a-entity id="t1" mindar-image-target="targetIndex: 1"></a-entity>

</a-scene>

<script>
window.addEventListener("load", () => {

  const box = document.querySelector("#custom-text");
  const t0 = document.querySelector("#t0");
  const t1 = document.querySelector("#t1");

  let lastTarget = null;

  const data = {
    0: "
      綠繡眼是一種小型鳥類，身體是綠色的，眼睛周圍有一圈白色羽毛，非常可愛。

牠們動作很靈活，常常在樹木間快速跳來跳去。

綠繡眼喜歡吸食花蜜，也會吃水果，因此常出現在開花的樹附近。",
    1: "
  白頭翁最大的特徵，就是頭上有白色羽毛，看起來像戴著白色帽子。

牠們喜歡停在樹枝上唱歌，叫聲相當響亮，在住宅區與校園中都很常見。

白頭翁喜歡吃水果、花蜜與小昆蟲，是台灣常見的都市鳥類之一。"
  };

  function show(text) {
    box.innerText = text;
    box.classList.add("show");
  }

  function hide() {
    box.classList.remove("show");
  }

  function handleFound(id) {
    console.log("FOUND:", id);
    lastTarget = id;
    show(data[id] || "未設定內容");
  }

  function handleLost(id) {
    console.log("LOST:", id);
    if (lastTarget === id) {
      lastTarget = null;
      hide();
    }
  }

  // ===== debug：看有沒有真的偵測 =====
  setInterval(() => {
    console.log(
      "t0 visible:", t0.object3D.visible,
      "t1 visible:", t1.object3D.visible
    );
  }, 1500);

  // ===== events =====
  t0.addEventListener("targetFound", () => handleFound(0));
  t0.addEventListener("targetLost", () => handleLost(0));

  t1.addEventListener("targetFound", () => handleFound(1));
  t1.addEventListener("targetLost", () => handleLost(1));

});
</script>

</body>
</html>
